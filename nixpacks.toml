[phases.setup]
nixPkgs = ["ffmpeg", "python311", "nodejs_20"]

[phases.install]
cmds = [
  "python3.11 -m venv /app/.venv && /app/.venv/bin/pip install -r requirements.txt",
  "cd web/frontend && npm install"
]

[phases.build]
cmds = ["cd web/frontend && npm run build"]

[start]
cmd = "/app/.venv/bin/python main.py"
